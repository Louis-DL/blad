name: Windows

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test windows/Blad.Core.Tests

  app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet publish windows/Blad.App/Blad.App.csproj -c Release -r win-x64 -p:Platform=x64 -o publish/Blad
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/Blad/* -DestinationPath Blad-windows-x64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: Blad-windows-x64
          path: Blad-windows-x64.zip
      - name: Smoke test
        shell: pwsh
        run: windows/scripts/smoke-test.ps1
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: Blad-windows-screenshots
          path: screenshots
